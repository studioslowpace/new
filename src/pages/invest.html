<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港股收息投資決策分析器</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        header h1 {
            margin: 0 0 10px 0;
            color: #fff;
            font-size: 24px;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            color: #fff;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #121214;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        /* 結果顯示樣式 */
        .result-box {
            background-color: #121214;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid var(--border);
        }

        .result-box.success { border-left-color: var(--success); }
        .result-box.warning { border-left-color: var(--warning); }
        .result-box.danger { border-left-color: var(--danger); }

        .result-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .suggestion-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }

        .tag-success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-warning { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .tag-danger { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }

        .notice-list {
            padding-left: 20px;
            margin: 10px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        .notice-list li {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>港股收息投資決策分析器</h1>
        <p>輸入股票與派息數據，自動計算最佳買入時機與「派息前賣出」決策</p>
    </header>

    <div class="grid">
        <!-- 輸入面板 -->
        <div class="card">
            <h2>投資數據輸入</h2>
            
            <div class="form-group">
                <label for="stockCode">股票代號 / 名稱</label>
                <input type="text" id="stockCode" value="0941.HK (中國移動)" placeholder="例如: 0005.HK">
            </div>

            <div class="form-group">
                <label for="buyPrice">你的買入成本價 (HKD)</label>
                <input type="number" id="buyPrice" value="70.0" step="0.1">
            </div>

            <div class="form-group">
                <label for="currentPrice">當前 / 除淨前夕股價 (HKD)</label>
                <input type="number" id="currentPrice" value="78.5" step="0.1">
            </div>

            <div class="form-group">
                <label for="shares">持有股數 (股)</label>
                <input type="number" id="shares" value="2000" step="100">
            </div>

            <div class="form-group">
                <label for="dividendPerShare">本次預計每股派息 (HKD)</label>
                <input type="number" id="dividendPerShare" value="2.4" step="0.01">
            </div>

            <div class="form-group">
                <label for="dividendTax">紅利稅/股息稅率 (%) *港股通一般為 20%</label>
                <select id="dividendTax">
                    <option value="0">0% (香港本地居民/持香港藍籌股)</option>
                    <option value="10">10% (外資持內地註冊H股)</option>
                    <option value="20" selected>20% (內地投資者經港股通)</option>
                </select>
            </div>

            <button class="btn" onclick="calculateDecision()">開始計算決策</button>
        </div>

        <!-- 輸出面板 -->
        <div class="card">
            <h2>分析與決策結果</h2>
            
            <div class="result-box">
                <div class="result-title">預估可得總股息 (已扣稅)</div>
                <div class="result-value" id="netDividend">HK$ 0.00</div>
            </div>

            <div class="result-box">
                <div class="result-title">目前帳面股價利潤 (未除淨)</div>
                <div class="result-value" id="capitalGain">HK$ 0.00</div>
            </div>

            <div class="result-box" id="decisionBox">
                <div class="result-title">系統核心投資建議</div>
                <div class="result-value" id="decisionText">請點擊左側計算按鈕</div>
                <div id="suggestionTag" style="display: none;"></div>
            </div>

            <div class="result-box">
                <div class="result-title">網站自動化買入窗口提示</div>
                <ul class="notice-list">
                    <li><b>左側安全期：</b> 建議在該股<b>除淨日（Ex-Date）前 30 至 60 天</b>分批佈局，避開除淨前夕的盲目拉高。</li>
                    <li><b>右側撿便宜：</b> 若決定棄息，可在<b>除淨日當天開盤後</b>，觀察股價扣除股息後的表現，若優質股跌破均線可重新接回。</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    function calculateDecision() {
        // 讀取輸入值
        const buyPrice = parseFloat(document.getElementById('buyPrice').value);
        const currentPrice = parseFloat(document.getElementById('currentPrice').value);
        const shares = parseInt(document.getElementById('shares').value);
        const dividendPerShare = parseFloat(document.getElementById('dividendPerShare').value);
        const dividendTaxRate = parseFloat(document.getElementById('dividendTax').value) / 100;

        // 1. 計算股息
        const grossDividend = dividendPerShare * shares;
        const taxCost = grossDividend * dividendTaxRate;
        const netDividend = grossDividend - taxCost;

        // 2. 計算目前帳面利潤
        const capitalGain = (currentPrice - buyPrice) * shares;

        // 顯示基礎計算結果
        document.getElementById('netDividend').innerText = `HK$ ${netDividend.toFixed(2)} (已扣稅: HK$ ${taxCost.toFixed(2)})`;
        document.getElementById('capitalGain').innerText = `HK$ ${capitalGain.toFixed(2)} (回報率: ${((currentPrice - buyPrice)/buyPrice*100).toFixed(2)}%)`;

        // 3. 決策邏輯判斷
        const decisionBox = document.getElementById('decisionBox');
        const decisionText = document.getElementById('decisionText');
        const suggestionTag = document.getElementById('suggestionTag');
        suggestionTag.style.display = "inline-block";

        // 清除舊樣式
        decisionBox.className = "result-box";

        if (capitalGain <= 0) {
            // 情況 A：目前住套房或剛好平手，不建議在除淨前割肉
            decisionBox.classList.add('success');
            decisionText.innerText = "建議「不放」，安心收息！";
            suggestionTag.className = "suggestion-tag tag-success";
            suggestionTag.innerText = "原因：目前帳面無利潤，賣出等於實質虧損。建議繼續持有拿股息，等待未來填息拉回成本。";
        } else if (capitalGain > netDividend) {
            // 情況 B：帳面價差利潤 大於 實質拿到的股息 -> 觸發棄息訊號
            decisionBox.classList.add('danger');
            decisionText.innerText = "建議「派息前放掉」，鎖定價差！";
            suggestionTag.className = "suggestion-tag tag-danger";
            suggestionTag.innerText = "原因：目前帳面利潤大於預期股息！除淨後股價會立刻向下跳空，若股票無法成功填息，你會「賺了利息、賠了本金」。現在賣出可將利潤完全落袋，且能完美規避紅利稅！";
        } else {
            // 情況 C：有賺錢，但帳面利潤還不夠多，小於股息
            decisionBox.classList.add('warning');
            decisionText.innerText = "建議「繼續持有」，參與除淨。";
            suggestionTag.className = "suggestion-tag tag-warning";
            suggestionTag.innerText = "原因：目前的帳面利潤不足以抵消放棄股息的損失。該股如果基本面良好且過往填息紀錄穩定，留著收息是更穩健的選擇。";
        }
    }

    // 頁面載入時先自動計算一次預設數值
    window.onload = calculateDecision;
</script>

</body>
</html>
